<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/trackIcon.svg" />
    <title>TrackTorr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root, [data-theme="dark"] {
        --bg: #050505;
        --bg-card: #0a0a1a;
        --bg-muted: #0f0f2a;
        --bg-hover: #1a1a3a;
        --bg-overlay: rgba(5,5,5,0.9);
        --text: #e0e0ff;
        --text-secondary: #a0a0c0;
        --text-muted: #606080;
        --border: #1a1a2e;
        --border-light: #2a2a4a;
        --primary: #46ebeb;
        --primary-hover: #6ef5f5;
        --primary-glow: rgba(70,235,235,0.3);
        --secondary: #7C4DFF;
        --secondary-glow: rgba(124,77,255,0.3);
        --accent: #FCEE0C;
        --accent-glow: rgba(252,238,12,0.3);
        --success: #46ebeb;
        --success-bg: rgba(70,235,235,0.1);
        --danger: #FB0A26;
        --danger-hover: #ff3355;
        --danger-bg: rgba(251,10,38,0.1);
        --warning: #FCEE0C;
        --warning-bg: rgba(252,238,12,0.1);
        --warning-text: #FFD600;
        --player-bg: #030308;
        --shadow: 0 0 20px rgba(70,235,235,0.1), 0 0 40px rgba(70,235,235,0.05);
        --shadow-lg: 0 0 30px rgba(70,235,235,0.2), 0 0 60px rgba(70,235,235,0.1);
        --radius: 4px;
        --radius-lg: 8px;
        --glow-cyan: 0 0 10px rgba(70,235,235,0.5), 0 0 20px rgba(70,235,235,0.3);
        --glow-violet: 0 0 10px rgba(124,77,255,0.5), 0 0 20px rgba(124,77,255,0.3);
      }
      [data-theme="light"] {
        --bg: #050505;
        --bg-card: #0a0a1a;
        --bg-muted: #0f0f2a;
        --bg-hover: #1a1a3a;
        --bg-overlay: rgba(5,5,5,0.9);
        --text: #e0e0ff;
        --text-secondary: #a0a0c0;
        --text-muted: #606080;
        --border: #1a1a2e;
        --border-light: #2a2a4a;
        --primary: #46ebeb;
        --primary-hover: #6ef5f5;
        --primary-glow: rgba(70,235,235,0.3);
        --secondary: #7C4DFF;
        --secondary-glow: rgba(124,77,255,0.3);
        --accent: #FCEE0C;
        --accent-glow: rgba(252,238,12,0.3);
        --success: #46ebeb;
        --success-bg: rgba(70,235,235,0.1);
        --danger: #FB0A26;
        --danger-hover: #ff3355;
        --danger-bg: rgba(251,10,38,0.1);
        --warning: #FCEE0C;
        --warning-bg: rgba(252,238,12,0.1);
        --warning-text: #FFD600;
        --player-bg: #030308;
        --shadow: 0 0 20px rgba(70,235,235,0.1), 0 0 40px rgba(70,235,235,0.05);
        --shadow-lg: 0 0 30px rgba(70,235,235,0.2), 0 0 60px rgba(70,235,235,0.1);
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background .3s ease, color .3s ease;
        background-image: 
          linear-gradient(rgba(70,235,235,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(70,235,235,0.03) 1px, transparent 1px);
        background-size: 50px 50px;
      }
      input, button, textarea, select {
        font: inherit;
        font-family: inherit;
      }
      input {
        background: var(--bg-card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        outline: none;
        padding: 10px 14px;
        transition: all .2s ease;
      }
      input:focus {
        border-color: var(--primary);
        box-shadow: var(--glow-cyan);
      }
      input::placeholder { color: var(--text-muted); }
      button {
        transition: all .15s ease;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--bg-muted); }
      ::-webkit-scrollbar-thumb { 
        background: linear-gradient(180deg, var(--danger), var(--primary), var(--secondary));
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover { 
        background: linear-gradient(180deg, var(--danger), var(--primary-hover), var(--secondary));
      }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes glitch {
        0%, 100% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
      }
      @keyframes neonPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }
      @keyframes cyberGlow {
        0%, 100% { box-shadow: 0 0 5px var(--primary), 0 0 10px var(--primary); }
        50% { box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary), 0 0 30px var(--primary); }
      }
      @keyframes dataStream {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 100%; }
      }
      @keyframes loginFadeOut {
        0% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
      }
      @keyframes mainFadeIn {
        0% { opacity: 0; transform: scale(0.95); filter: blur(10px); }
        100% { opacity: 1; transform: scale(1); filter: blur(0); }
      }
      .cyber-text {
        text-shadow: 0 0 5px var(--primary), 0 0 10px var(--primary);
      }
      .cyber-border {
        position: relative;
      }
      .cyber-border::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
        border-radius: inherit;
        z-index: -1;
        opacity: 0;
        transition: opacity .3s ease;
      }
      .cyber-border:hover::before {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
