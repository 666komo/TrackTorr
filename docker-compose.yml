services:
  tracktorr:
    build: .
    container_name: tracktorr
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - HOST=0.0.0.0
      - INDEXER_URL=http://192.168.0.184:30096
      - INDEXER_API_KEY=${INDEXER_API_KEY:-}
      - DOWNLOAD_DIR=/data/downloads
    volumes:
      - tracktorr-data:/data

volumes:
  tracktorr-data: